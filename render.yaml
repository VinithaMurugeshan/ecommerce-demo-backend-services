services:
  - type: web
    name: ecommerce-api
    runtime: node
    plan: free
    # Build the TypeScript into dist/ and apply DB migrations before boot.
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      # Set these in the Render dashboard (marked secret / not synced):
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: usd
      - key: BCRYPT_ROUNDS
        value: "10"
